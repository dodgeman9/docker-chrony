# Default NTP servers (overridden at runtime by entrypoint.sh via NTP_SERVERS)
server 0.pool.ntp.org iburst
server 1.pool.ntp.org iburst

# Standard Chrony settings
driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony

# Step the system clock on startup if offset is larger than 1 second (first 3 updates)
makestep 1.0 3

# Enable kernel synchronization of the hardware real-time clock (RTC)
rtcsync

# Allow clients to query this server (configurable via CHRONY_ALLOW_LIST)
allow all

# Continue serving time even if the upstream source is temporarily lost
local stratum 10
