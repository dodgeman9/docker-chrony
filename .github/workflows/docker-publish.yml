name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Runs at 00:00 every Sunday to pull the latest base image patches
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows you to manually trigger a build from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Required permissions for the tagging action to push new tags to your repo
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so the tagger can find the last version

      - name: Block committed .env or key files
        run: |
          FORBIDDEN=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|key|p12|pfx)$' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Forbidden .env or private key files detected in repository:"
            echo "$FORBIDDEN"
            exit 1
          fi

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 1. Automatically increment the version tag on code pushes (skip tag creation on weekly cron rebuilds and PRs)
      - name: Bump version and push tag
        id: tag_version
        if: github.event_name != 'schedule' && github.event_name != 'pull_request'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Extract metadata for Docker tagging logic
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Update this with your actual Docker Hub username
          images: dodgeman9/chrony
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.tag_version.outputs.new_tag }},enable=${{ github.event_name != 'schedule' && steps.tag_version.outputs.new_tag != '' }}
            type=sha,format=short

      # 3. Authenticate with Docker Hub
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and push the image with multiple tags
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 5. Update Docker Hub Description
      - name: Update Docker Hub Description
        if: github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: dodgeman9/chrony
          # This tells the action to use your README.md file
          readme-filepath: ./README.md
