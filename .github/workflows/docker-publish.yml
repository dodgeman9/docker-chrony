name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]
  schedule:
    # Runs at 00:00 every Sunday to pull the latest base image patches
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows you to manually trigger a build from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Required permissions for the tagging action to push new tags to your repo
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so the tagger can find the last version

      # 1. Automatically increment the version tag (e.g., 1.0.1 -> 1.0.2)
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Extract metadata for Docker tagging logic
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Update this with your actual Docker Hub username
          images: dodgeman9/chrony
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.tag_version.outputs.new_tag }}
            type=sha,format=short

      # 3. Authenticate with Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and push the image with multiple tags
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
# 5. Update Docker Hub Description
      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: YOUR_DOCKER_HUB_USERNAME/chrony
          # This tells the action to use your README.md file
          readme-filepath: ./README.md
